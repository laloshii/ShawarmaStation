<!doctype html>
<html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shawarma Station | الإدارة</title><link rel="icon" href="/logo.png"><link rel="stylesheet" href="/station.css">
<header class="top"><a href="/" class="brand"><img src="/logo.png" alt="">Shawarma Station</a><div class="actions"><a href="/">عرض المينو ↗</a><button data-theme aria-label="تبديل المظهر">◐</button><button id="logout" hidden>خروج</button></div></header>
<main><form id="login" class="panel login"><img src="/logo.png" width="70" alt=""><h1>دخول الإدارة</h1><label>كلمة المرور<input id="password" required maxlength="512" type="password" autocomplete="current-password"></label><button class="primary">دخول</button></form>

<dialog id="editor"></dialog><p id="notice" role="status" hidden></p><script type="module" src="/admin.js"></script></html>
